name: Build Spark Ink APK

on:
  push:
    paths:
      - "app/**"
      - "core/**"
      - "*.kts"
      - "gradle/**"
      - ".github/workflows/apk.yml"
      - ".github/smoke.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Protocol and parser tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkInk-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator (no publish when it crashes)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: sh .github/smoke.sh

      - name: Publish as the "sparkink-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SparkInk.apk
          gh release delete sparkink-latest --cleanup-tag --yes || true
          gh release create sparkink-latest SparkInk.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Spark Ink (latest build)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Install over the previous version; notes and settings are kept."
